# =========================================================
# APPLICATION
# =========================================================
 
spring.application.name=api-gateway
server.port=8080
 
 
# =========================================================
# ACTUATOR
# =========================================================
 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=true
 
 
# =========================================================
# EUREKA
# =========================================================
 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
 
 
# =========================================================
# SPRING CLOUD GATEWAY
# =========================================================
 
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=false
spring.cloud.gateway.server.webmvc.default-filters[0]=PreserveHostHeader

# Swagger UI served by the gateway. Each URL is a gateway route to a service spec.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Authentication Service
springdoc.swagger-ui.urls[0].url=/authentication/v3/api-docs
springdoc.swagger-ui.urls[1].name=Profile Service
springdoc.swagger-ui.urls[1].url=/profile/v3/api-docs
springdoc.swagger-ui.urls[2].name=Crop Service
springdoc.swagger-ui.urls[2].url=/crop/v3/api-docs
springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/order/v3/api-docs
springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/payment/v3/api-docs
springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=/notification/v3/api-docs
springdoc.swagger-ui.urls[6].name=Subscription Service
springdoc.swagger-ui.urls[6].url=/subscription/v3/api-docs
 
 
# =========================================================
# MICROSERVICE ROUTES
# =========================================================
 
 
# Authentication Service OpenAPI
spring.cloud.gateway.server.webmvc.routes[10].id=authentication-api-docs
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://AUTHENTICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/authentication/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[10].filters[0]=RewritePath=/authentication/v3/api-docs,/v3/api-docs
 
 
